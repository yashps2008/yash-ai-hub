<script>
const {useState,useEffect,useRef}=React,h=React.createElement;
const uid=()=>Math.random().toString(36).slice(2,9);

const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':new Date(t).toLocaleDateString()};
const okUrl=u=>/^https?:\/\/\S+\.\S+/.test(u);
const norm=u=>u&&!/^https?:\/\//i.test(u)?'https://'+u:u;

/* ---------- local demo assistant (rule-based, NOT an AI model) ---------- */
function reply(t,name,autos){
  const s=t.toLowerCase(),c=t.match(/(-?\d+(?:\.\d+)?)\s*([+\-*x\/×÷])\s*(-?\d+(?:\.\d+)?)/);
  if(c){const a=+c[1],b=+c[3],o=c[2];const r=o=='+'?a+b:o=='-'?a-b:o=='/'||o=='÷'?(b?a/b:'undefined'):a*b;return a+' '+o+' '+b+' = '+r}
  if(/^(hi|hello|hey|namaste)/.test(s))return 'Hello '+name+'! I’m the local demo assistant. Try “help”.';
  if(/time|date|today/.test(s))return 'Your device says: '+new Date().toLocaleString();
  if(/automation/.test(s))return 'You have '+autos.length+' demo automation(s), '+autos.filter(a=>a.enabled).length+' enabled. Open the Instagram tab to create or edit them.';
  if(/idea|caption|content/.test(s))return 'Content ideas (template list):\n• Behind-the-scenes reel\n• “3 mistakes” carousel\n• Q&A with a comment keyword\n• Before/after story';
  if(/privacy|data/.test(s))return 'All your data lives only in this browser’s localStorage. Nothing is uploaded.';
  if(/help|what can/.test(s))return 'I’m a simple rule-based demo. I can: do basic maths (12*7), tell the time, summarise your automations, and share content ideas. A real AI model can be wired in later.';
  return 'I’m a local demo with fixed rules, so I can’t really understand that yet. Try “help”.';
}

/* ---------- reusable bits ---------- */
const Card=p=>h('div',{className:'card '+(p.c||''),style:p.style,onClick:p.onClick},p.children);

/* ---------- Dashboard ---------- */

  return h('div',{className:'page gap'},
    h('div',null,h('div',{className:'mu'},g),h('h1',null,'Welcome back, '+(prof.name.trim()||'there')),h('div',{className:'mu'},'Your private control center.')),
    h('div',{className:'grid g4'},st.map(x=>h(Card,{key:x[0],c:'stat'},h('b',null,x[1]),h('span',{className:'mu'},x[0])))),
    h('h2',null,'Quick actions'),
    h('div',{className:'grid'},q.map(x=>h(Card,{key:x[1],c:'tap',onClick:x[3]},h('div',{style:{fontSize:22,color:'var(--a)'}},x[0]),h('div',{style:{fontWeight:600}},x[1]),h('div',{className:'mu'},x[2])))),
    h('h2',null,'Recent activity'),
    h(Card,null,log.length?log.slice(0,5).map(l=>h('div',{key:l.id,className:'row sp',style:{padding:'6px 0'}},h('span',{className:'row'},h('i',{className:'dot'}),l.t),h('span',{className:'mu'},ago(l.at)))):h(Empty,{i:'∅',t:'No activity yet. Create an automation or start a chat.'})));
}

/* ---------- Assistant ---------- */
function Chat({chats,cid,setCid,send,clear,del}){
  const [txt,setTxt]=useState(''),[hist,setHist]=useState(false),end=useRef();
  const cur=chats.find(c=>c.id===cid),msgs=cur?cur.msgs:[];
  useEffect(()=>{end.current&&end.current.scrollIntoView({behavior:'smooth'})},[msgs.length,cid]);
  const go=()=>{if(!txt.trim())return;send(txt.trim());setTxt('')};

    h('div',{className:'row sp wr'},h('div',null,h('h1',null,'AI Assistant'),h('span',{className:'tag'},'LOCAL DEMO · rule-based, no AI model')),
      h('div',{className:'row'},h('button',{className:'btn gh sm',onClick:()=>setHist(!hist)},'History ('+chats.length+')'),h('button',{className:'btn sm',onClick:()=>{setCid(null);setHist(false)}},'+ New'),cur&&h('button',{className:'btn dg sm',onClick:clear},'Clear'))),
    hist&&h(Card,{c:'mt',style:{maxHeight:'35vh',overflowY:'auto',flex:'none'}},chats.length?chats.map(c=>h('div',{key:c.id,className:'row sp',style:{padding:'6px 0'}},h('button',{className:'ni',style:{padding:'4px 0',color:c.id==cid?'var(--a)':'var(--tx)'},onClick:()=>{setCid(c.id);setHist(false)}},c.title||'Untitled'),h('button',{className:'btn dg sm',onClick:()=>del(c.id)},'Delete'))):h('div',{className:'mu'},'No saved chats yet.')),
    h('div',{className:'chat mt'},

      h('div',{className:'row'},h('input',{className:'in',placeholder:'Message the local assistant…',value:txt,onChange:e=>setTxt(e.target.value),onKeyDown:e=>e.key=='Enter'&&go()}),h('button',{className:'btn',onClick:go},'Send'))));

/* ---------- Instagram dashboard ---------- */
function IG({autos,log,newAuto,edit,toggle,del,clearLog}){const [cd,setCd]=useState(null);
  return h('div',{className:'page gap'},
    h('div',{className:'row sp wr'},h('div',null,h('h1',null,'Instagram Automation'),h('div',{className:'mu'},'Comment → DM flows')),h('button',{className:'btn',onClick:newAuto},'+ Create Automation')),

    autos.length?autos.map(a=>h(Card,{key:a.id},

    h('div',{className:'row sp'},h('h2',null,'Activity log'),log.length>0&&h('button',{className:'btn gh sm',onClick:clearLog},'Clear log')),
    h(Card,null,log.length?log.slice(0,20).map(l=>h('div',{key:l.id,className:'row sp',style:{padding:'5px 0'}},h('span',null,l.t),h('span',{className:'mu'},ago(l.at)))):h(Empty,{i:'∅',t:'No events. Only your own actions are logged — no real Instagram activity exists in demo mode.'})));
}

/* ---------- Builder ---------- */
const blank=()=>({id:uid(),name:'',post:'Select post/reel…',trigger:'keyword',keywords:[],dm:true,follow:false,msg:'Hey! Thanks for commenting 🙌 Here are the links you asked for:',links:[],enabled:false});
function Builder({init,save,cancel,del,isNew,say}){
  const [d,setD]=useState(init),[kw,setKw]=useState(''),[cd,setCd]=useState(false);
  const up=o=>setD(x=>({...x,...o}));
  const addKw=()=>{const ks=kw.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);if(!ks.length)return;const nw=[...new Set(ks)].filter(k=>!d.keywords.includes(k));if(!nw.length)return say('Keyword already added');up({keywords:[...d.keywords,...nw]});setKw('')};
  const setL=(i,o)=>up({links:d.links.map((l,j)=>j==i?{...l,...o}:l)});
  const mv=(i,n)=>{const a=[...d.links];if(n<0||n>=a.length)return;[a[i],a[n]]=[a[n],a[i]];up({links:a})};
  const go=()=>{
    if(!d.name.trim())return say('Give the automation a name');

  };
  return h('div',{className:'page gap'},
    h('div',{className:'row sp'},h('h1',null,isNew?'New Automation':'Edit Automation'),h('button',{className:'btn gh sm',onClick:cancel},'← Back')),h(Demo),
    h(Card,{c:'gap'},
      h('label',{className:'f'},'Automation name',h('input',{className:'in',value:d.name,placeholder:'e.g. Free guide giveaway',onChange:e=>up({name:e.target.value})})),
      h('label',{className:'f'},'Post / reel (placeholder — no account connected)',h('select',{className:'in',value:d.post,onChange:e=>up({post:e.target.value})},['Select post/reel…','Demo Reel #1','Demo Reel #2','Demo Post #1','Demo Post #2'].map(o=>h('option',{key:o,style:{background:'#111'}},o))))),
    h(Card,{c:'gap'},h('h2',null,'Trigger'),
      h('div',{className:'row'},[['keyword','Keyword match'],['any','Any comment']].map(t=>h('button',{key:t[0],className:'btn sm'+(d.trigger==t[0]?'':' gh'),onClick:()=>up({trigger:t[0]})},t[1]))),
      d.trigger=='keyword'&&h('div',{className:'gap'},h('div',{className:'row'},h('input',{className:'in',value:kw,placeholder:'Type keyword, press Enter',onChange:e=>setKw(e.target.value),onKeyDown:e=>e.key=='Enter'&&addKw()}),h('button',{className:'btn gh',onClick:addKw},'Add')),
        h('div',{className:'row wr'},d.keywords.length?d.keywords.map(k=>h('span',{key:k,className:'chip'},k,h('button',{onClick:()=>up({keywords:d.keywords.filter(x=>x!=k)})},'✕'))):h('span',{className:'mu'},'No keywords yet.')))),
    h(Card,{c:'gap'},h(Toggle,{label:'Send initial DM',sub:'Message sent to the commenter',on:d.dm,set:v=>up({dm:v})}),h(Toggle,{label:'Follow verification (optional)',sub:'Ask the user to follow before sending links',on:d.follow,set:v=>up({follow:v})}),h(Toggle,{label:'Enabled',sub:'Demo flag only — nothing is sent',on:d.enabled,set:v=>up({enabled:v})})),
    h(Card,{c:'gap'},h('h2',null,'DM message'),h('textarea',{className:'in',rows:4,value:d.msg,onChange:e=>up({msg:e.target.value})})),
    h(Card,{c:'gap'},h('div',{className:'row sp'},h('h2',null,'Links ('+d.links.length+'/10)'),h('button',{className:'btn gh sm',disabled:d.links.length>=10,onClick:()=>up({links:[...d.links,{id:uid(),title:'',url:'',desc:''}]})},'+ Add link')),
      d.links.length?d.links.map((l,i)=>h('div',{key:l.id,className:'lk'},
        h('input',{className:'in',placeholder:'Title',value:l.title,onChange:e=>setL(i,{title:e.target.value})}),
        h('input',{className:'in',placeholder:'https://…',value:l.url,style:l.url&&!okUrl(norm(l.url.trim()))?{borderColor:'#f43f5e'}:null,onChange:e=>setL(i,{url:e.target.value})}),
        h('input',{className:'in',placeholder:'Description (optional)',value:l.desc,onChange:e=>setL(i,{desc:e.target.value})}),
        h('div',{className:'row'},h('button',{className:'btn gh sm','aria-label':'Move up',disabled:i==0,onClick:()=>mv(i,i-1)},'↑'),h('button',{className:'btn gh sm','aria-label':'Move down',disabled:i==d.links.length-1,onClick:()=>mv(i,i+1)},'↓'),h('button',{className:'btn dg sm',onClick:()=>up({links:d.links.filter((_,j)=>j!=i)})},'Delete')))):h('div',{className:'mu'},'No links yet. Add up to 10.')),
    h(Card,{c:'gap'},h('h2',null,'DM preview'),
      d.dm?h('div',{className:'dm'},h('div',{className:'m'},d.msg||'(empty message)'),d.follow&&h('div',{className:'l mu'},'☑ “Follow to unlock links” step'),d.links.map(l=>h('div',{key:l.id,className:'l'},h('div',{style:{fontWeight:600}},l.title||'Untitled link'),h('div',{className:'mu'},l.desc),h('div',{style:{color:'var(--b)',fontSize:12,wordBreak:'break-all'}},l.url||'https://…')))):h('div',{className:'mu'},'Initial DM is off.')),
    h('div',{className:'row wr'},h('button',{className:'btn',onClick:go},'Save automation'),!isNew&&h('button',{className:'btn dg',onClick:()=>cd?del(d.id):(setCd(true),say('Tap again to confirm delete'))},cd?'Confirm delete':'Delete')));
}

/* ---------- Settings ---------- */
function Settings({prof,setProf,reset,say}){
  const [sure,setSure]=useState(false);
  const ok=(()=>{try{localStorage.setItem('yah_t','1');localStorage.removeItem('yah_t');return true}catch(e){return false}})();
  return h('div',{className:'page gap'},h('h1',null,'Settings'),
    h(Card,{c:'gap'},h('h2',null,'Profile'),h('label',{className:'f'},'Display name',h('input',{className:'in',value:prof.name,onChange:e=>setProf({...prof,name:e.target.value})})),h('button',{className:'btn gh sm',style:{justifySelf:'start'},onClick:()=>say('Profile saved')},'Saved automatically ✓')),
    h(Card,{c:'gap'},h('h2',null,'Theme accent'),h('div',{className:'row'},Object.keys(AC).map(k=>h('button',{key:k,'aria-label':k,className:'sw'+(prof.accent==k?' on':''),style:{background:'linear-gradient(135deg,'+AC[k][0]+','+AC[k][1]+')'},onClick:()=>{setProf({...prof,accent:k});say('Theme: '+k)}}))),h('div',{className:'mu'},'Dark mode is the default and only base theme.')),
    h(Card,{c:'gap'},h('h2',null,'Privacy'),h('div',{className:'mu'},'This is a private, single-user dashboard. There is no sign-up, no social feature, no analytics and no server. Everything is stored in this browser’s localStorage and never leaves your device. Clearing browser data erases it.')),
    h(Card,{c:'gap'},h('h2',null,'App information'),h('span',{className:'tag'+(ok?' on':''),style:{justifySelf:'start'}},ok?'STORAGE OK · data persists':'STORAGE BLOCKED · data won’t persist'),h('div',{className:'mu'},'YASH AI HUB v0.1 · Demo build · React 18 · Single file, easy to export.\nAssistant: local rules, no AI API.\nInstagram: NOT connected — demo only.'.split('\n').map((t,i)=>h('div',{key:i},t)))),
    h(Card,{c:'gap'},h('h2',null,'Danger zone'),h('button',{className:'btn dg',style:{justifySelf:'start'},onClick:()=>{if(sure){reset();setSure(false)}else{setSure(true);say('Tap again to confirm reset')}}},sure?'Confirm: erase all data':'Reset all data')));
}

/* ---------- App shell ---------- */
function App(){
  const [view,setView]=useState('dash'),[draft,setDraft]=useState(null);
  const [prof,setProf]=useLS('yah_prof',{name:'Yash',accent:'violet'}),[autos,setAutos]=useLS('yah_autos',[]),[chats,setChats]=useLS('yah_chats',[]),[log,setLog]=useLS('yah_log',[]);
  const [cid,setCid]=useState(null),[toast,setToast]=useState(null);
  const say=m=>{setToast(m);clearTimeout(window._t);window._t=setTimeout(()=>setToast(null),2200)};
  const lg=t=>setLog(l=>[{id:uid(),t,at:Date.now()},...l].slice(0,50));
  useEffect(()=>{const a=AC[prof.accent]||AC.violet,r=document.documentElement.style;r.setProperty('--a',a[0]);r.setProperty('--b',a[1])},[prof.accent]);
  const go=v=>{setView(v);setDraft(null)};
  const newAuto=()=>{setDraft({d:blank(),isNew:true});setView('build')};
  const patch=(id,f)=>setChats(cs=>cs.map(c=>c.id==id?f(c):c));
  const send=text=>{let id=cid;if(!id||!chats.find(c=>c.id==id)){id=uid();setCid(id);setChats(cs=>[{id,title:text.slice(0,30),msgs:[]},...cs])}
    patch(id,c=>({...c,msgs:[...c.msgs,{r:'u',t:text}]}));
    setTimeout(()=>patch(id,c=>({...c,msgs:[...c.msgs,{r:'a',t:reply(text,prof.name,autos)}]})),450)};
  const save=a=>{const ex=autos.some(x=>x.id==a.id);setAutos(xs=>ex?xs.map(x=>x.id==a.id?a:x):[a,...xs]);lg((ex?'Updated':'Created')+' automation “'+a.name+'” (demo)');say('Automation saved');go('ig')};
  const toggle=id=>{const a=autos.find(x=>x.id==id);setAutos(xs=>xs.map(x=>x.id==id?{...x,enabled:!x.enabled}:x));lg((a.enabled?'Disabled':'Enabled')+' “'+a.name+'” (demo flag)');say(a.enabled?'Disabled':'Enabled (demo — nothing is sent)')};
  const del=id=>{const a=autos.find(x=>x.id==id);setAutos(xs=>xs.filter(x=>x.id!=id));lg('Deleted automation “'+(a?a.name:'')+'”');say('Automation deleted');go('ig')};
  const reset=()=>{[setProf,setAutos,setChats,setLog].forEach((s,i)=>s([{name:'Yash',accent:'violet'},[],[],[]][i]));setCid(null);say('All data erased')};
  const nav=[['dash','⌂','Home'],['chat','✦','Assistant'],['ig','◎','Instagram'],['set','⚙','Settings']];
  const cur=view=='build'?'ig':view;
  const page=view=='dash'?h(Dash,{prof,autos,chats,log,go,newAuto}):
    view=='chat'?h(Chat,{chats,cid,setCid,send,clear:()=>{patch(cid,c=>({...c,msgs:[]}));say('Conversation cleared')},del:id=>{setChats(cs=>cs.filter(c=>c.id!=id));if(cid==id)setCid(null);say('Chat deleted')}}):
    view=='ig'?h(IG,{autos,log,newAuto,edit:a=>{setDraft({d:a,isNew:false});setView('build')},toggle,del,clearLog:()=>{setLog([]);say('Log cleared')}}):
    view=='build'&&draft?h(Builder,{key:draft.d.id,init:draft.d,isNew:draft.isNew,save,del,say,cancel:()=>go('ig')}):
    h(Settings,{prof,setProf,reset,say});
  const btn=(n,c)=>h('button',{key:n[0],className:'ni'+(cur==n[0]?' on':''),onClick:()=>go(n[0])},h('span',{style:{fontSize:18}},n[1]),n[2]);
  return h(React.Fragment,null,
    h('aside',{className:'side'},h('div',{className:'logo'},h('i',null,'✦'),'YASH AI HUB'),nav.map(btn)),
    h('main',{className:'main'},page),
    h('nav',{className:'bot'},nav.map(btn)),
    toast&&h('div',{className:'toast'},toast));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
